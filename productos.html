<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo · LMO INOX SPA</title>
    <meta name="description" content="Catálogo LMO INOX: flanges, fitting, tubos, perfiles, cañerías, válvulas, planchas, HDPE, duplex y súper duplex." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  </head>
  <body data-page="productos">
    <div class="frame" data-app>
      <main class="main" id="contenido">
        <header class="page-intro">
          <p class="kicker"><span class="rule"></span> Catálogo técnico</p>
          <h1>Ítems para cotizar, no para decorar.</h1>
          <p class="lede" style="margin-top:0.8rem">Filtre por familia y aleación. Cada ficha lleva norma, rango y acabado para armar la cotización sin ida y vuelta innecesaria.</p>
        </header>
        <form class="filters" role="search">
          <label class="field">
            <span>Buscar</span>
            <input name="q" type="search" placeholder="Ej. flange 316, HDPE, 2205…" />
          </label>
          <label class="field">
            <span>Familia</span>
            <select name="cat"></select>
          </label>
          <label class="field">
            <span>Material</span>
            <select name="mat"></select>
          </label>
        </form>
        <p class="kicker" style="margin-bottom:0.8rem"><span class="rule"></span> <span data-tally>00 ítems</span></p>
        <div class="product-grid" data-grid></div>
      </main>
    </div>
    <script type="module" src="/src/catalog.js"></script>
  </body>
</html>
