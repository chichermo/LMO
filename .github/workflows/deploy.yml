name: Publicar en lmoinox.cl

# Nota: Host.cl suele bloquear FTP desde IPs de GitHub Actions (ETIMEDOUT :21).
# Si este workflow falla, desplegar desde el PC:
#   $env:FTP_SERVER="ftp.lmoinox.cl"
#   $env:FTP_USERNAME="..."
#   $env:FTP_PASSWORD="..."
#   npm run deploy
# O subir lmo-web.zip a public_html en cPanel.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y FTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Subir dist/ a public_html
        uses: Wandalen/wretry.action@v3.5.0
        with:
          attempt_limit: 3
          attempt_delay: 30000
          action: SamKirkland/FTP-Deploy-Action@v4.3.5
          with: |
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            protocol: ftp
            port: 21
            local-dir: ./dist/
            server-dir: public_html/
            timeout: 300000
            log-level: verbose
            exclude: |
              **/.git*
              **/.git*/**
              **/.github/**
              **/.well-known/**
              **/cgi-bin/**
              **/mail/**
              **/tmp/**
